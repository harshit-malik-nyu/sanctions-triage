[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctions-triage"
version = "0.1.0"
description = "Where to set a sanctions screening threshold, and what it costs to be wrong in each direction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
