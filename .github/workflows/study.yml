name: study
on:
  push:
    branches: [main]
    paths: ['.study-trigger', 'src/**', 'scripts/**']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: study
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Run study
        run: python scripts/run_study.py 2>&1 | tee evidence/run.txt
      - name: Job summary
        if: always()
        run: |
          { echo '## Study run'; echo; echo '```'; tail -60 evidence/run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: study run [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
