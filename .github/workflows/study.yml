name: study
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Run study
        run: |
          mkdir -p evidence docs
          set -o pipefail
          python scripts/run_study.py 2>&1 | tee evidence/run.txt
      - name: Job summary
        if: always()
        run: |
          { echo '## Study run'; echo; echo '```'; tail -60 evidence/run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-study-evidence
          path: |
            evidence/
            docs/
