name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate sources for a clean entity population
        run: |
          # SEC requires a declared UA of the form "Name contact@domain"
          SEC_UA="sanctions-triage-research harshit-malik-nyu@users.noreply.github.com"
          probe() {
            code=$(curl --globoff -sL -o /tmp/o -w "%{http_code}" --max-time 40 -H "User-Agent: $2" "$1")
            echo "HTTP=$code bytes=$(wc -c < /tmp/o)  $3"
            echo "   head: $(head -c 220 /tmp/o | tr '\n' ' ')"
            echo
          }
          {
            echo "# clean-population probe"
            echo "run_at=$(date -u +%FT%TZ)"
            echo
            probe "https://www.sec.gov/files/company_tickers.json" "$SEC_UA" "SEC EDGAR companies (declared UA)"
            probe "https://api.gleif.org/api/v1/lei-records?page[size]=5" "sanctions-triage/0.1" "GLEIF LEI records"
            probe "https://api.gleif.org/api/v1/lei-records?page[size]=1&filter[entity.legalAddress.country]=US" "sanctions-triage/0.1" "GLEIF filtered by country"
            echo "--- OFAC alt.csv structure (the true-positive source) ---"
            curl --globoff -sL --max-time 40 "https://www.treasury.gov/ofac/downloads/alt.csv" -o /tmp/alt.csv
            echo "alt.csv lines: $(wc -l < /tmp/alt.csv)"
            head -5 /tmp/alt.csv
            echo
            echo "--- SDN primary names ---"
            curl --globoff -sL --max-time 40 "https://www.treasury.gov/ofac/downloads/sdn.csv" -o /tmp/sdn.csv
            echo "sdn.csv lines: $(wc -l < /tmp/sdn.csv)"
            head -3 /tmp/sdn.csv
            echo
            echo "entity-type breakdown:"
            cut -d, -f3 /tmp/sdn.csv | sort | uniq -c | sort -rn | head -6
          } > PROBE.txt 2>&1
          cat PROBE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-availability-probe
          path: PROBE.txt
